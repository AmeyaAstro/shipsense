[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipsense"
version = "0.1.0"
description = "Late-delivery risk prediction and LLM operations copilot for logistics"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
# The notebook is generated by scripts/make_eda_notebook.py; lint the generator, not its output.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/F: errors & undefined/unused names, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["shipsense"]
